# ElasticMQ: implementacao local compativel com a API do AWS SQS.
# Usada somente no docker-compose; na AWS o servico aponta para a fila real.
include classpath("application.conf")

node-address {
    protocol = http
    host = elasticmq
    port = 9324
    context-path = ""
}

rest-sqs {
    enabled = true
    bind-port = 9324
    bind-hostname = "0.0.0.0"
    sqs-limits = strict
}

queues {
    togglemaster-events {
        defaultVisibilityTimeout = 30 seconds
        receiveMessageWait = 0 seconds
    }
}
