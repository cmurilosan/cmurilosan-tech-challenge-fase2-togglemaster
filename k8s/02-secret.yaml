# Etapa 4 - Dados sensiveis: as conexoes com senha das 3 instancias RDS, a
# chave mestra do auth-service e a chave de servico do evaluation-service.
#
# ATENCAO: este arquivo fica no Git com PLACEHOLDERS, porque o manifesto do
# Secret e um entregavel do desafio. Voce preenche os valores reais na hora de
# aplicar e NAO comita essa edicao. Para restaurar os placeholders depois:
#
#     git checkout k8s/02-secret.yaml
#
# Lembrete de seguranca (aula 5 de Kubernetes Basico): o Secret e apenas
# codificado em base64, NAO criptografado. Protege contra exposicao acidental,
# nao contra um atacante com acesso ao cluster. Protecao real exigiria
# encryption at rest no etcd ou AWS Secrets Manager -- fora do escopo aqui.
#
# Credenciais da AWS nao aparecem neste Secret de proposito: os pods usam a
# role de instancia dos nos do EKS (LabRole) via IMDS, que e o padrao do SDK.
apiVersion: v1
kind: Secret
metadata:
  name: togglemaster-secrets
  namespace: togglemaster
  labels:
    app.kubernetes.io/part-of: togglemaster
type: Opaque
# stringData aceita texto puro; o Kubernetes converte para base64 sozinho.
stringData:
  # ------------------------------------------------------------------ RDS
  # Em cada uma das 3 linhas, troque o usuario, a senha e o endpoint.
  # Obter os endpoints com:
  #   aws rds describe-db-instances \
  #     --query 'DBInstances[].[DBInstanceIdentifier,Endpoint.Address]' --output table
  # O nome do banco (auth_db, flags_db, targeting_db) NAO muda.
  DATABASE_URL_AUTH: "postgres://togglemaster:TROQUE-A-SENHA@TROQUE-ENDPOINT-RDS-AUTH:5432/auth_db?sslmode=require"
  DATABASE_URL_FLAGS: "postgres://togglemaster:TROQUE-A-SENHA@TROQUE-ENDPOINT-RDS-FLAGS:5432/flags_db?sslmode=require"
  DATABASE_URL_TARGETING: "postgres://togglemaster:TROQUE-A-SENHA@TROQUE-ENDPOINT-RDS-TARGETING:5432/targeting_db?sslmode=require"

  # ------------------------------------------------------------ aplicacao
  # Chave mestra que autoriza criar novas chaves de API (POST /admin/keys).
  # Escolha uma senha forte; e ela que voce usa no smoke test do cluster.
  MASTER_KEY: "TROQUE-POR-UMA-CHAVE-MESTRA-FORTE"

  # Chave que o evaluation-service usa para chamar o flag-service e o
  # targeting-service. Diferente do ambiente local: aqui ela e emitida de
  # verdade pelo auth-service depois que o cluster esta no ar, e colada aqui.
  # Na primeira aplicacao deixe como esta -- o passo 9 do runbook explica.
  SERVICE_API_KEY: "TROQUE-PELA-CHAVE-EMITIDA-PELO-AUTH-SERVICE"
